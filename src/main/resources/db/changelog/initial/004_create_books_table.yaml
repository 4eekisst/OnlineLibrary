databaseChangeLog:
  - changeSet:
      id: create_books_table
      author: Adil
      changes:
        - createTable:
            tableName: books
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: author
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_category_id
                    references: categories(id)
                    nullable: false
              - column:
                  name: image
                  type: varchar(255)
              - column:
                  name: available_copies
                  type: bigint
                  constraints:
                    nullable: false